<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REST API Secure Login</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>POP UP EMOJI</header>

    <main>
      <form id="apiForm">
        <fieldset>
          <legend>Emoji Categories:</legend>

          <section>
            <label>
              Catagory 1: Faces
              <input name="smileys-and-people" />
            </label>
          </section>
          <br />
          <section>
            <label>
              Catagory 2: Beverages
              <input name="food-and-drink" />
            </label>
          </section>
        </fieldset>
        <button type="submit">Get Category</button>
      </form>
      <output id="category" for="queryForm"></output>
    </main>
  </body>
</html>
