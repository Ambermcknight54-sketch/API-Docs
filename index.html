<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REST API Secure Login</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Account Login</h1>
    </header>

    <main>
      <form id="apiForm">
        <fieldset>
          <legend>Login</legend>

          <section>
            Email:
            <label for="usernameInput"></label>
            <input type="email" />
            <figcaption id="usernameInput"></figcaption>
          </section>

          <br />

          <section>
            Password:
            <label for="passwordInput"></label>
            <input type="password" />
            <figcaption id="password"></figcaption>
          </section>

          <br />

          <button>Submit</button>
        </fieldset>
      </form>

      <hr />

      <!-- Display Area for JavaScript Messages -->
      <section id="outputDisplay">
        <!-- output is used to show the result of a user action or calculation -->
        <output id="statusMessage">
          Please enter your credentials above to authenticate.
        </output>
      </section>
    </main>

    <footer></footer>
  </body>
</html>
